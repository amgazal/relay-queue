name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELAY_TEST_DATABASE_URL: postgres://relay:relay_local@127.0.0.1:5432/relay
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate schema on PostgreSQL 17
        run: make test-schema
      - name: Validate Go and run database integration tests
        run: |
          test -n "$RELAY_TEST_DATABASE_URL"
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -count=1 -race ./...
      - name: Build and exercise container images
        run: python3 tests/compose_smoke.py
